openapi: 3.1.0
info:
  title: Gitana Remote Repository Tool Bridge - Local Transport
  version: "1.0"
  description: |
    Loopback HTTP surface of the bridge (spec 5.1, Appendix B). The listener binds to `127.0.0.1`
    (mandatory) and `::1` when supported (non-fatal on failure; RTB-03), and requires authentication
    (RTB-22). Bodies are JSON validated against the schemas in ../schemas. Port and limits are the
    Appendix D defaults and are tunable.

    Response model (Phase A A2/A3): `list_branches` and `read_file` return synchronous `200` with
    `ResponseEnvelope`; mutating operations (`create_branch`, `write_file`, `delete_file`,
    `create_pull_request`) return `202 Accepted` with `AcceptedResponse` and are polled via
    `GET /api/v1/requests/{request_id}`.
servers:
  - url: http://127.0.0.1:18765
    description: Default IPv4 loopback listener (DV-RTB-PORT).
  - url: http://[::1]:18765
    description: IPv6 loopback listener, where supported.
security:
  - localClientBearer: []
paths:
  /api/v1/health:
    get:
      operationId: health
      summary: Non-sensitive liveness
      security: []
      responses:
        "200":
          description: Alive. Reveals no credentials, contents or configuration (RTB-18).
          content:
            application/json:
              schema:
                $ref: ../schemas/local-transport.v1.json#/$defs/Health
  /api/v1/capabilities:
    get:
      operationId: capabilities
      summary: Contract version and supported operations
      responses:
        "200":
          description: Capabilities. No secrets.
          content:
            application/json:
              schema:
                $ref: ../schemas/local-transport.v1.json#/$defs/Capabilities
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/tools/{operation}:
    post:
      operationId: submitToolRequest
      summary: Submit a canonical tool request
      description: |
        The path operation MUST equal the envelope's `operation`. There is no generic proxy and no
        arbitrary path forwarding (RTB-19); only the six canonical operations are routable.
        `list_branches` and `read_file` return synchronous `200`; `create_branch`, `write_file`,
        `delete_file`, and `create_pull_request` return `202` + poll.
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            $ref: ../schemas/tool-contract.v1.json#/$defs/Operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/tool-contract.v1.json#/$defs/RequestEnvelope
      responses:
        "200":
          description: Synchronous terminal or outcome-unknown result (`list_branches`, `read_file`).
          content:
            application/json:
              schema:
                $ref: ../schemas/tool-contract.v1.json#/$defs/ResponseEnvelope
        "202":
          description: Accepted for asynchronous execution/approval (`create_branch`, `write_file`, `delete_file`, `create_pull_request`). Poll `GET /api/v1/requests/{request_id}`.
          content:
            application/json:
              schema:
                $ref: ../schemas/local-transport.v1.json#/$defs/AcceptedResponse
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "5XX":
          $ref: "#/components/responses/Error"
  /api/v1/requests/{request_id}:
    get:
      operationId: getRequestStatus
      summary: Read request lifecycle status
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Current lifecycle state. Carries no arguments or file content.
          content:
            application/json:
              schema:
                $ref: ../schemas/lifecycle.v1.json#/$defs/RequestStatus
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/requests/{request_id}/cancel:
    post:
      operationId: cancelRequest
      summary: Cancel a cancellable or already-cancelled request (idempotent)
      description: |
        Transitions pre-dispatch states (`RECEIVED`, `AUTHORIZED`, `AWAITING_APPROVAL`) or `MANUAL_REVIEW`
        to `CANCELLED`. Idempotent when the request is already `CANCELLED`. Returns `409 Conflict` if the
        request is actively dispatching/reconciling (`EXECUTING`, `OUTCOME_UNKNOWN`, `RECONCILING`) or in
        another terminal state (`SUCCEEDED`, `FAILED`, `EXPIRED`, `REJECTED`).
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Resulting lifecycle state (`CANCELLED`).
          content:
            application/json:
              schema:
                $ref: ../schemas/lifecycle.v1.json#/$defs/RequestStatus
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    localClientBearer:
      type: http
      scheme: bearer
      description: |
        Local-client credential: 32 random bytes, base64url without padding. Sent only in the
        Authorization header, never in a URL or query string. Independent of relay and GitHub credentials (RTB-04).
  parameters:
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: ../schemas/common.v1.json#/$defs/RequestId
  responses:
    Error:
      description: Failure. Carries a ResponseEnvelope when a request_id is established, or TransportError for pre-request transport/auth failures.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../schemas/tool-contract.v1.json#/$defs/ResponseEnvelope
              - $ref: ../schemas/local-transport.v1.json#/$defs/TransportError
