name: Build Debug APK

# Builds the debug APK for the :app module. Modelled on inscope-labs/operator-console's
# build-apk-debug.yml, except that this repo has no Gradle wrapper (no gradlew or wrapper jar), so
# Gradle itself is provisioned by gradle/actions/setup-gradle and invoked as `gradle`.
# This workflow does not gate merges.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read pinned Gradle version
        id: gradle-version
        run: |
          set -euo pipefail
          version="$(sed -nE 's#^distributionUrl=.*/gradle-([0-9][0-9.]*)-bin\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare debug keystore
        # app/build.gradle.kts signs debug builds with ${rootDir}/debug.keystore (gitignored).
        run: |
          set -euo pipefail
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest test

      - name: Lint
        # The lint baseline is unknown for this scaffold, so it is reported without failing the job.
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Upload debug APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore
